[project]
name = "sthymuli-firmware"
version = "0.0.1"
description = "MicroPython firmware for the Sthymuli educational robot"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Sthymuli Contributors" }]
keywords = ["robotics", "education", "micropython", "esp32", "sthymuli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Education",
    "Topic :: Software Development :: Embedded Systems",
]

# The firmware itself has no pip-installable runtime dependencies — it's
# MicroPython, not CPython. Everything listed below is for laptop-side
# tooling: running unit tests, linting, and syncing to the board.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mpremote>=1.24",
    "esptool>=4.8",
]

[project.urls]
Homepage = "https://github.com/Sthymuli/firmware"
Hardware = "https://github.com/nathmo/Sthymuli-motherboard"
Issues = "https://github.com/Sthymuli/firmware/issues"

# ---- Tooling configuration ----

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes (essentials)
# I   = import sorting
# UP  = modern Python idioms
# B   = likely bugs (bugbear)
select = ["E", "F", "I", "UP", "B"]
# MicroPython doesn't know about some typing features; we're relaxed on those.
ignore = ["E501"]  # line length enforced by formatter, not the linter

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sthymuli*"]
